<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Autoplay Video with Sound</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
    }

    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 2em;
      cursor: pointer;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <div class="overlay" onclick="playVideo()">
      Click to Start 
    </div>
    <video id="myVideo">
      <source src="video.mp4" type="video/mp4">
      ඔබේ browser එකට මේ video එක play කරන්න බැහැ.
    </video>
  </div>

  <script>
    function playVideo() {
      const video = document.getElementById('myVideo');
      video.volume = 1.0;
      video.play();
      document.querySelector('.overlay').style.display = 'none';
    }
  </script>

</body>
</html>
